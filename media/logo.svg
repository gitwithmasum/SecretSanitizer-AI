<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#10192E"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Neon Purple Gradient -->
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Shield Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- High-tech HUD grid lines -->
  <g opacity="0.12" stroke="#00F2FE" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="512"/>
    <line x1="432" y1="0" x2="432" y2="512"/>
    <line x1="0" y1="80" x2="512" y2="80"/>
    <line x1="0" y1="432" x2="512" y2="432"/>
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="6 8"/>
  </g>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="256" cy="250" r="140" fill="url(#coreGlow)"/>

  <!-- Outer Cyber Shield Frame (Glowing) -->
  <path d="M 256 68 
           L 396 124 
           L 396 264 
           C 396 358 256 428 256 428 
           C 256 428 116 358 116 264 
           L 116 124 Z" 
        fill="url(#plateGrad)" 
        stroke="url(#cyanNeon)" 
        stroke-width="6" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Cyber Contour Line -->
  <path d="M 256 94 
           L 374 142 
           L 374 256 
           C 374 336 256 396 256 396 
           C 256 396 138 336 138 256 
           L 138 142 Z" 
        fill="none" 
        stroke="url(#purpleNeon)" 
        stroke-width="2.5" 
        stroke-dasharray="14 6"
        opacity="0.85"/>

  <!-- Circuit Trace Nodes -->
  <g stroke="#00F2FE" stroke-width="2" fill="#00F2FE">
    <!-- Top left trace -->
    <path d="M 170 180 L 210 180 L 230 200" fill="none" opacity="0.6"/>
    <circle cx="170" cy="180" r="3.5"/>
    <circle cx="230" cy="200" r="3.5"/>

    <!-- Top right trace -->
    <path d="M 342 180 L 302 180 L 282 200" fill="none" opacity="0.6"/>
    <circle cx="342" cy="180" r="3.5"/>
    <circle cx="282" cy="200" r="3.5"/>

    <!-- Bottom center trace -->
    <line x1="256" y1="340" x2="256" y2="375" opacity="0.7"/>
    <circle cx="256" cy="375" r="3.5"/>
  </g>

  <!-- Central Futuristic "S" & Quantum Shield Insignia -->
  <!-- Upper Cyber Shard of S -->
  <path d="M 298 162 
           L 220 162 
           C 198 162 182 178 182 200 
           C 182 222 198 238 220 238 
           L 282 238 
           C 308 238 326 256 326 280 
           L 326 288
           L 292 288
           L 292 280
           C 292 272 284 266 274 266
           L 212 266
           L 212 238"
        fill="none"
        stroke="url(#cyanNeon)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Lower Cyber Shard of S -->
  <path d="M 214 340 
           L 292 340 
           C 314 340 330 324 330 302 
           C 330 280 314 264 292 264 
           L 230 264 
           C 204 264 186 246 186 222 
           L 186 214
           L 220 214
           L 220 222
           C 220 230 228 236 238 236
           L 300 236
           L 300 264"
        fill="none"
        stroke="url(#purpleNeon)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Center Core Quantum Spark -->
  <polygon points="256,224 268,252 256,280 244,252" 
           fill="#FFFFFF" 
           filter="url(#softGlow)"/>

  <!-- Tech Corner Markers -->
  <g stroke="#06B6D4" stroke-width="2" opacity="0.6">
    <path d="M 28 48 L 48 48 L 48 28"/>
    <path d="M 484 48 L 464 48 L 464 28"/>
    <path d="M 28 464 L 48 464 L 48 484"/>
    <path d="M 484 464 L 464 464 L 464 484"/>
  </g>
</svg>
