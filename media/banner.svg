<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="40%" stop-color="#0B1120"/>
      <stop offset="80%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Neon Purple Gradient -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Chip Background -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="leftAmbientGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightAmbientGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace; }
    .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Banner Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bannerBg)"/>
  <rect width="1198" height="418" x="1" y="1" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Ambient Color Clouds -->
  <circle cx="220" cy="210" r="260" fill="url(#leftAmbientGlow)"/>
  <circle cx="950" cy="180" r="320" fill="url(#rightAmbientGlow)"/>

  <!-- Futuristic Cyber Grid -->
  <g opacity="0.08" stroke="#00F2FE" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>

    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Corner Tech Accents -->
  <g stroke="#00F2FE" stroke-width="2" opacity="0.7">
    <path d="M 24 44 L 44 44 L 44 24"/>
    <path d="M 1176 44 L 1156 44 L 1156 24"/>
    <path d="M 24 376 L 44 376 L 44 396"/>
    <path d="M 1176 376 L 1156 376 L 1156 396"/>
  </g>

  <!-- ==================== LEFT LOGO EMBLEM ==================== -->
  <g transform="translate(40, 20)">
    <!-- Outer Shield Hexagon Plate -->
    <path d="M 180 50 
             L 285 92 
             L 285 204 
             C 285 284 180 340 180 340 
             C 180 340 75 284 75 204 
             L 75 92 Z" 
          fill="#0B1324" 
          stroke="url(#neonCyan)" 
          stroke-width="4.5" 
          stroke-linejoin="round"
          filter="url(#glowFilter)"/>

    <!-- Inner Shield Inset Ring -->
    <path d="M 180 72 
             L 267 106 
             L 267 196 
             C 267 262 180 310 180 310 
             C 180 310 93 262 93 196 
             L 93 106 Z" 
          fill="none" 
          stroke="url(#neonPurple)" 
          stroke-width="2" 
          stroke-dasharray="10 5"
          opacity="0.8"/>

    <!-- Central S Insignia Top Segment -->
    <path d="M 215 125 
             L 155 125 
             C 138 125 125 138 125 155 
             C 125 172 138 185 155 185 
             L 205 185 
             C 225 185 240 200 240 220 
             L 240 226
             L 215 226
             L 215 220
             C 215 214 208 208 200 208
             L 150 208
             L 150 185"
          fill="none"
          stroke="url(#neonCyan)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#textGlow)"/>

    <!-- Central S Insignia Bottom Segment -->
    <path d="M 145 265 
             L 205 265 
             C 222 265 235 252 235 235 
             C 235 218 222 205 205 205 
             L 155 205 
             C 135 205 120 190 120 170 
             L 120 164
             L 145 164
             L 145 170
             C 145 176 152 182 160 182
             L 210 182
             L 210 205"
          fill="none"
          stroke="url(#neonPurple)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#textGlow)"/>

    <!-- Quantum Core Spark -->
    <polygon points="180,178 190,195 180,212 170,195" fill="#FFFFFF" filter="url(#textGlow)"/>

    <!-- Subtle Radar Rings -->
    <circle cx="180" cy="195" r="130" fill="none" stroke="#00F2FE" stroke-width="1" opacity="0.15" stroke-dasharray="4 8"/>
    <circle cx="180" cy="195" r="160" fill="none" stroke="#A855F7" stroke-width="1" opacity="0.1" stroke-dasharray="8 12"/>
  </g>

  <!-- ==================== RIGHT CONTENT & DETAILS ==================== -->
  <g transform="translate(380, 50)">
    <!-- Top HUD Status Row -->
    <g class="font-mono" font-size="11" font-weight="600">
      <!-- Armored Status -->
      <rect x="0" y="0" width="145" height="26" rx="13" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#10B981"/>
      <text x="26" y="17" fill="#34D399">SYSTEM: ARMORED</text>

      <!-- Zero-Egress Status -->
      <rect x="155" y="0" width="165" height="26" rx="13" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1"/>
      <text x="168" y="17" fill="#38BDF8">EGRESS: 0.0% LOCAL</text>

      <!-- Latency Status -->
      <rect x="330" y="0" width="140" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
      <text x="342" y="17" fill="#C084FC">SCAN: &lt;3ms LATENCY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" class="font-sans" font-size="44" font-weight="900" letter-spacing="-1">
      <tspan fill="#FFFFFF">SecretSanitizer</tspan>
      <tspan fill="url(#neonCyan)" filter="url(#textGlow)"> AI</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="125" class="font-mono" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="1.5">
      NEXT-GEN AI PRIVACY FIREWALL &amp; DEVELOPER SECURITY PLATFORM
    </text>

    <!-- Core Description Paragraph -->
    <text x="0" y="158" class="font-sans" font-size="13" fill="#CBD5E1" opacity="0.85">
      Real-time deterministic credential detection, Shannon entropy verification, and format-preserving
    </text>
    <text x="0" y="178" class="font-sans" font-size="13" fill="#CBD5E1" opacity="0.85">
      redaction designed for AI prompts, system clipboards, and developer workspaces.
    </text>

    <!-- ==================== FEATURE BADGE CARDS ==================== -->
    <g transform="translate(0, 210)">
      <!-- Badge 1: Chrome Extension -->
      <g>
        <rect x="0" y="0" width="235" height="42" rx="10" fill="url(#chipBg)" stroke="#06B6D4" stroke-width="1.2"/>
        <text x="14" y="26" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">🌐 Chrome Extension</text>
        <text x="152" y="26" class="font-mono" font-size="11" fill="#00F2FE">MV3 Core</text>
      </g>

      <!-- Badge 2: VS Code Extension -->
      <g transform="translate(250, 0)">
        <rect x="0" y="0" width="240" height="42" rx="10" fill="url(#chipBg)" stroke="#8B5CF6" stroke-width="1.2"/>
        <text x="14" y="26" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">⚡ VS Code Extension</text>
        <text x="156" y="26" class="font-mono" font-size="11" fill="#C084FC">Realtime</text>
      </g>

      <!-- Badge 3: Git Pre-Commit Hook -->
      <g transform="translate(505, 0)">
        <rect x="0" y="0" width="250" height="42" rx="10" fill="url(#chipBg)" stroke="#10B981" stroke-width="1.2"/>
        <text x="14" y="26" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">🛑 Git Pre-Commit</text>
        <text x="148" y="26" class="font-mono" font-size="11" fill="#34D399">Auto-Block</text>
      </g>
    </g>

    <!-- Supported Platforms Pill Bar -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="755" height="34" rx="8" fill="#080D1A" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="22" class="font-mono" font-size="11" font-weight="700" fill="#64748B">PROTECTED PLATFORMS:</text>
      <text x="190" y="22" class="font-sans" font-size="12" font-weight="600" fill="#E2E8F0">
        ChatGPT <tspan fill="#06B6D4">&bull;</tspan> Claude AI <tspan fill="#06B6D4">&bull;</tspan> Google Gemini <tspan fill="#06B6D4">&bull;</tspan> Microsoft Copilot <tspan fill="#06B6D4">&bull;</tspan> Perplexity AI
      </text>
    </g>
  </g>
</svg>
